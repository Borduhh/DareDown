<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Offline by policy as well as by design: no scheme that can reach the
      network is allowed, and inline scripts are refused so raw HTML inside a
      Markdown document cannot execute. The main process cancels non-local
      requests too — this is the second lock on the same door.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self' file:;
               style-src 'self' file: 'unsafe-inline';
               img-src 'self' file: data: blob:;
               font-src 'self' file: data:;
               media-src 'self' file: data: blob:;
               connect-src 'none';
               object-src 'none';
               frame-src 'none';
               base-uri 'none';
               form-action 'none';"
    />
    <title>DareDown</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body data-theme="light">
    <div class="app" id="app">
      <!-- Slim window bar; doubles as the drag region. -->
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="btn-sidebar" title="Toggle sidebar (⌘B)" aria-label="Toggle sidebar">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <rect x="2.5" y="3.5" width="15" height="13" rx="2.5" />
              <line x1="7.5" y1="3.5" x2="7.5" y2="16.5" />
            </svg>
          </button>
          <div class="crumbs" id="crumbs"></div>
        </div>
        <div class="topbar-right">
          <button class="icon-btn" id="btn-full-width" title="Full width (⌘\)" aria-label="Toggle full width" aria-pressed="false">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <line x1="2.5" y1="4" x2="2.5" y2="16" />
              <line x1="17.5" y1="4" x2="17.5" y2="16" />
              <line x1="6" y1="10" x2="14" y2="10" />
              <polyline points="8.4,7.6 6,10 8.4,12.4" />
              <polyline points="11.6,7.6 14,10 11.6,12.4" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-theme" title="Light / dark (⇧⌘T)" aria-label="Toggle theme">
            <svg viewBox="0 0 20 20" aria-hidden="true" class="ico-sun">
              <circle cx="10" cy="10" r="3.6" />
              <g class="rays">
                <line x1="10" y1="1.5" x2="10" y2="3.4" />
                <line x1="10" y1="16.6" x2="10" y2="18.5" />
                <line x1="1.5" y1="10" x2="3.4" y2="10" />
                <line x1="16.6" y1="10" x2="18.5" y2="10" />
                <line x1="4.1" y1="4.1" x2="5.4" y2="5.4" />
                <line x1="14.6" y1="14.6" x2="15.9" y2="15.9" />
                <line x1="4.1" y1="15.9" x2="5.4" y2="14.6" />
                <line x1="14.6" y1="5.4" x2="15.9" y2="4.1" />
              </g>
            </svg>
            <svg viewBox="0 0 20 20" aria-hidden="true" class="ico-moon">
              <path d="M15.6 12.6A6.6 6.6 0 0 1 7.4 4.4a6.6 6.6 0 1 0 8.2 8.2Z" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-prefs" title="Preferences (⌘,)" aria-label="Preferences">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <line x1="3" y1="6" x2="17" y2="6" />
              <circle cx="12.5" cy="6" r="2.1" />
              <line x1="3" y1="13.5" x2="17" y2="13.5" />
              <circle cx="7" cy="13.5" r="2.1" />
            </svg>
          </button>
        </div>
      </header>

      <div class="reading-progress" id="progress"><i></i></div>

      <div class="workspace">
        <!-- One left pane holding two views; the tabs switch between them. -->
        <aside class="sidebar" id="sidebar" data-pane="files" aria-label="Sidebar">
          <div class="sidebar-tabs" role="tablist" aria-label="Sidebar views">
            <button
              class="sidebar-tab"
              id="tab-files"
              data-pane="files"
              role="tab"
              aria-controls="pane-files"
              aria-selected="true"
            >
              Files
            </button>
            <button
              class="sidebar-tab"
              id="tab-outline"
              data-pane="outline"
              role="tab"
              aria-controls="pane-outline"
              aria-selected="false"
            >
              Outline
            </button>
            <button class="icon-btn sm sidebar-action" id="btn-open-folder" title="Open folder (⇧⌘O)" aria-label="Open folder">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M2.5 6.2a1.7 1.7 0 0 1 1.7-1.7h3l1.6 2h5.5a1.7 1.7 0 0 1 1.7 1.7v6.1a1.7 1.7 0 0 1-1.7 1.7H4.2a1.7 1.7 0 0 1-1.7-1.7Z" />
              </svg>
            </button>
          </div>

          <div class="sidebar-pane" id="pane-files" role="tabpanel" aria-labelledby="tab-files">
            <div class="sidebar-sub">
              <span class="sidebar-title" id="sidebar-title">No folder</span>
            </div>
            <nav class="tree" id="tree" tabindex="0"></nav>
          </div>

          <div class="sidebar-pane" id="pane-outline" role="tabpanel" aria-labelledby="tab-outline">
            <nav class="outline-list" id="outline-list"></nav>
          </div>

          <div class="sidebar-grip" id="sidebar-grip" role="separator" aria-orientation="vertical"></div>
        </aside>

        <main class="main" id="main">
          <div class="tabstrip" id="tabstrip" role="tablist" hidden></div>
          <div class="scroller" id="scroller" tabindex="-1">
            <article class="prose" id="doc" aria-live="polite"></article>
          </div>
          <section class="welcome" id="welcome">
            <div class="welcome-inner">
              <h1>DareDown</h1>
              <p class="lede">A markdown reader that isn&rsquo;t afraid of anything &mdash; not even your gnarliest .md files.</p>
              <div class="welcome-actions">
                <button class="btn primary" id="welcome-file">Open a file…</button>
                <button class="btn" id="welcome-folder">Open a folder…</button>
              </div>
              <dl class="welcome-keys">
                <div><dt>⌘O</dt><dd>Open file</dd></div>
                <div><dt>⇧⌘O</dt><dd>Open folder</dd></div>
                <div><dt>⌘P</dt><dd>Quick open</dd></div>
                <div><dt>⌘/</dt><dd>All shortcuts</dd></div>
              </dl>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div class="overlay-root" id="overlay-root"></div>
    <div class="toast-root" id="toast-root" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
